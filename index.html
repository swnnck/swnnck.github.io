<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adventure Personality Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
            background-color: #f4f4f4;
        }

        #quiz, #result {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
            border: none;
            background-color: #4CAF50;
            color: white;
        }

        button:hover {
            background-color: #45a049;
        }

        #result {
            display: none;
        }

        img {
            max-width: 200px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="quiz">
    <h2 id="questionText"></h2>
    <button id="answerA"></button>
    <button id="answerB"></button>
</div>

<div id="result">
    <h2 id="resultTitle"></h2>
    <img id="resultImage" src="" alt="Result Image">
</div>

<script src="script.js"></script>

<script>
    // These must exist for your JS to work
    const answerA = document.getElementById("answerA");
    const answerB = document.getElementById("answerB");
    const questionText = document.getElementById("questionText");

    function displayQuestion() {
        const display = questions[currentQuestion];
        questionText.textContent = display.question;
        answerA.textContent = display.answers[0].text;
        answerB.textContent = display.answers[1].text;

        answerA.onclick = () => selectAnswer(display.answers[0].type);
        answerB.onclick = () => selectAnswer(display.answers[1].type);
    }

    function showResult() {
        document.getElementById("quiz").style.display = "none";
        document.getElementById("result").style.display = "block";

        let personaResult = Object.keys(scores)[0];

        for (let type in scores) {
            if (scores[type] > scores[personaResult]) {
                personaResult = type;
            }
        }

        document.getElementById("resultTitle").textContent = results[personaResult].title;
        document.getElementById("resultImage").src = results[personaResult].image;
    }

    displayQuestion();
</script>

</body>
</html>
